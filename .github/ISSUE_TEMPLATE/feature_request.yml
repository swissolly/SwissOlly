name: Feature request
description: An idea that would make SwissOlly better for you.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or question behind the idea helps more than the solution alone.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        The [roadmap](https://swissolly.io/roadmap) lists what's already planned.
