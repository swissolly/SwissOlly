name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    strategy:
      matrix:
        platform: [x64, ARM64]
        include:
          - platform: x64
            runtime: win-x64
          - platform: ARM64
            runtime: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SwissOlly.sln

      - name: Check formatting
        run: dotnet format SwissOlly.sln --verify-no-changes --verbosity diagnostic
        continue-on-error: true

      - name: Build solution
        run: dotnet build SwissOlly.sln -c Release -p:Platform=${{ matrix.platform }} --no-restore

      - name: Run tests
        if: matrix.platform == 'x64'
        run: dotnet test SwissOlly.Tests/SwissOlly.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: SwissOlly.Tests/TestResults/*.trx

      - name: Publish app (self-contained)
        run: dotnet publish SwissOlly.App/SwissOlly.App.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.runtime }} --self-contained -o publish/${{ matrix.platform }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swissolly-${{ matrix.platform }}
          path: publish/${{ matrix.platform }}
          retention-days: 14
