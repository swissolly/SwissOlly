name: CI

on:
  push:
    branches: [main, dev, 'cwyrick/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SwissOlly.sln

      - name: Check formatting
        run: dotnet format SwissOlly.sln --verify-no-changes --no-restore --verbosity normal

  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
        include:
          - platform: x64
            runtime: win-x64
            arch_flag: x64compatible
          - platform: ARM64
            runtime: win-arm64
            arch_flag: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SwissOlly.sln

      - name: Build solution
        run: dotnet build SwissOlly.sln -c Release -p:Platform=${{ matrix.platform }} --no-restore

      # Tests run on x64 only. The tested code (layout engine, config, store, migration, chart
      # point reduction) is architecture-neutral managed code with no native dependency besides
      # SQLite, whose ARM64 binary ships in the same package; the ARM64 leg still compiles and
      # publishes every project. Revisit if a test ever touches PDH, ETW or other native APIs.
      - name: Run tests
        if: matrix.platform == 'x64'
        run: dotnet test SwissOlly.Tests/SwissOlly.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.platform }}
          path: SwissOlly.Tests/TestResults/*.trx

      - name: Publish app (self-contained)
        run: dotnet publish SwissOlly.App/SwissOlly.App.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.runtime }} --self-contained -o publish/${{ matrix.platform }}

      # Compile the installer on every run so a broken script shows up here, not on release day.
      # Pinned: the ISCC path below is Inno Setup 6's, and a version 7 package installs elsewhere.
      - name: Install Inno Setup
        # --allow-downgrade: the runner image may already carry a newer 6.x.
        run: choco install innosetup --version=6.7.1 --allow-downgrade -y --no-progress

      - name: Compile installer (smoke test)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=0.0.0" "/DMyAppArch=${{ matrix.arch_flag }}" "/DMyPublishDir=..\publish\${{ matrix.platform }}" "/DMyOutputSuffix=-${{ matrix.platform }}" installer/swissolly-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swissolly-${{ matrix.platform }}
          path: publish/${{ matrix.platform }}
          retention-days: 14
