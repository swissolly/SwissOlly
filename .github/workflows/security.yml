name: Security Scan

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 8am UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SwissOlly.sln

      - name: Check for vulnerable packages
        run: dotnet list SwissOlly.sln package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt

      - name: Fail on critical vulnerabilities
        shell: pwsh
        run: |
          $report = Get-Content vulnerability-report.txt -Raw
          if ($report -match "Critical|High") {
            Write-Error "Critical or High severity vulnerabilities found. See report above."
            exit 1
          }
          Write-Host "No critical or high vulnerabilities found."

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-report
          path: vulnerability-report.txt

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # The job token is read-only, so PR comments would fail; findings show in the log.
          GITLEAKS_ENABLE_COMMENTS: false

  code-quality:
    name: Code Quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SwissOlly.sln

      - name: Build with analysis
        run: dotnet build SwissOlly.sln -c Release -p:Platform=x64 -p:TreatWarningsAsErrors=false --no-restore

      - name: Check for outdated packages
        run: dotnet list SwissOlly.sln package --outdated
        continue-on-error: true
