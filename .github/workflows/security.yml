name: Security Scan

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 8am UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SwissOlly.sln

      - name: Check for vulnerable packages
        run: dotnet list SwissOlly.sln package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt

      - name: Fail on critical vulnerabilities
        shell: pwsh
        run: |
          $report = Get-Content vulnerability-report.txt -Raw
          if ($report -match "Critical|High") {
            Write-Error "Critical or High severity vulnerabilities found. See report above."
            exit 1
          }
          Write-Host "No critical or high vulnerabilities found."

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnerability-report
          path: vulnerability-report.txt

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # The job token is read-only, so PR comments would fail; findings show in the log.
          GITLEAKS_ENABLE_COMMENTS: false

  code-quality:
    name: Code Quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SwissOlly.sln

      - name: Build with analysis
        run: dotnet build SwissOlly.sln -c Release -p:Platform=x64 -p:TreatWarningsAsErrors=false --no-restore

      - name: Check for outdated packages
        run: dotnet list SwissOlly.sln package --outdated
        continue-on-error: true
