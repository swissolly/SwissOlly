name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 1.2.0). Must match <Version> in Directory.Build.props.'
        required: true
        default: '1.2.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # A tag push releases that tag; a manual run releases the version typed in. Read through env,
  # never interpolated into scripts, so the input can't inject shell.
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  # Everything that can refuse a release runs first, before two installer builds are spent on it.
  verify:
    name: Verify release
    runs-on: windows-latest
    outputs:
      number: ${{ steps.version.outputs.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, to check the release commit is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check version
        id: version
        shell: pwsh
        run: |
          # Exactly one leading v: a manual run given "v1.2.0" (the input wants 1.2.0) would
          # otherwise tag and draft "vv1.2.0".
          # [0-9] and \z: \d takes any Unicode digit and $ allows a trailing newline, which would
          # pass here and then break the git tag step.
          if ($env:RELEASE_VERSION -cmatch '^v([0-9]+\.[0-9]+\.[0-9]+)\z') {
            $version = $Matches[1]
          } else {
            Write-Error "Release version '$env:RELEASE_VERSION' must look like v1.2.0 (for a manual run, type 1.2.0)."
            exit 1
          }
          # One version everywhere: the tag, the installer and the app's assembly version.
          [xml]$props = Get-Content Directory.Build.props
          $projectVersion = "$($props.Project.PropertyGroup.Version)".Trim()
          if ($projectVersion -ne $version) {
            Write-Error "Directory.Build.props says $projectVersion but this release is $version. Bump <Version> first."
            exit 1
          }
          "number=$version" >> $env:GITHUB_OUTPUT

      - name: Check the release commit is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "$env:GITHUB_SHA isn't on main. Merge the release first, then tag main."
            exit 1
          }

      - name: Check the tag is new (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          # The full-history checkout above fetched every tag, so this needs no credentials.
          git rev-parse -q --verify "refs/tags/$env:RELEASE_VERSION" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Tag $env:RELEASE_VERSION already exists."
            exit 1
          }
          exit 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test SwissOlly.Tests/SwissOlly.Tests.csproj -c Release --verbosity normal

  build-installer:
    name: Build Installer (${{ matrix.platform }})
    runs-on: windows-latest
    needs: verify
    # The Azure federated credential trusts this environment only, so restrict the environment
    # to main and v* tags in the repo settings. Pull requests never reach this job.
    environment: release
    permissions:
      contents: read
      # Lets azure/login swap GitHub's OIDC token for an Azure one: no signing secret is stored.
      id-token: write

    strategy:
      matrix:
        platform: [x64, ARM64]
        include:
          - platform: x64
            runtime: win-x64
            arch_flag: x64compatible
          - platform: ARM64
            runtime: win-arm64
            arch_flag: arm64

    env:
      # Signing turns on when the repository variable ARTIFACT_SIGNING_ACCOUNT is set (Settings,
      # Secrets and variables, Actions, Variables). The other settings it needs:
      #   variables ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_PROFILE, SIGNING_PUBLISHER
      #   secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
      SIGNING: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
      # Microsoft's signing client for signtool, pinned by version and hash.
      SIGN_CLIENT_VERSION: '1.0.151'
      SIGN_CLIENT_SHA256: '35375a4bc4e1102da729fc3d8d9925f774c3baae6b8b7ff6398d948ca9ab0d8a'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # NuGet packages bring their own build targets; don't leave the repo token on disk for them.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SwissOlly.sln

      - name: Publish app (self-contained ${{ matrix.platform }})
        run: dotnet publish SwissOlly.App/SwissOlly.App.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.runtime }} --self-contained -p:Version=${{ needs.verify.outputs.number }} -o publish/${{ matrix.platform }}

      # Signing is for SmartScreen and publisher trust: the app runs asInvoker with uiAccess
      # off, so nothing requires a signature to run. Unsigned builds still release, and the
      # release notes have to say so. Signed ones go through installer/sign.ps1 only.
      - name: Azure login (signing)
        if: env.SIGNING == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare signing
        if: env.SIGNING == 'true'
        shell: pwsh
        env:
          SIGN_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          SIGN_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          foreach ($name in 'SIGN_ENDPOINT', 'SIGN_PROFILE', 'SIGN_PUBLISHER') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { Write-Error "Signing is on but the $name setting is empty."; exit 1 }
          }

          # The client needs signtool from Windows SDK 10.0.22621.755 or later (not 10.0.20348).
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool -or [version]$signtool.Directory.Parent.Name -lt [version]'10.0.22621.0') {
            Write-Error 'No signtool.exe from Windows SDK 10.0.22621 or later on this runner.'; exit 1
          }

          $client = Join-Path $env:RUNNER_TEMP 'artifact-signing-client'
          $package = "$client.zip"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$env:SIGN_CLIENT_VERSION/microsoft.artifactsigning.client.$env:SIGN_CLIENT_VERSION.nupkg" -OutFile $package
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash
          if ($hash -ne $env:SIGN_CLIENT_SHA256) { Write-Error "Signing client hash $hash doesn't match the pinned one."; exit 1 }
          Expand-Archive $package -DestinationPath $client
          $dlib = Join-Path $client 'bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) { Write-Error "No $dlib in the signing client package."; exit 1 }

          # Sign in only through the Azure CLI session azure/login made; skip the others.
          $metadata = Join-Path $env:RUNNER_TEMP 'artifact-signing-metadata.json'
          @{
            Endpoint = $env:SIGN_ENDPOINT
            CodeSigningAccountName = $env:SIGN_ACCOUNT
            CertificateProfileName = $env:SIGN_PROFILE
            CorrelationId = "$env:GITHUB_REPOSITORY run $env:GITHUB_RUN_ID"
            ExcludeCredentials = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content $metadata -Encoding utf8

          "SWISSOLLY_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SWISSOLLY_SIGN_DLIB=$dlib" >> $env:GITHUB_ENV
          "SWISSOLLY_SIGN_METADATA=$metadata" >> $env:GITHUB_ENV
          "SWISSOLLY_PUBLISHER=$env:SIGN_PUBLISHER" >> $env:GITHUB_ENV

      - name: Sign SwissOlly's own binaries
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          # Only what this repo builds; the runtime and NuGet packages carry their makers' signatures.
          $files = @(Get-ChildItem "publish/${{ matrix.platform }}" -File |
            Where-Object { $_.Name -like 'SwissOlly*.exe' -or $_.Name -like 'SwissOlly*.dll' } |
            ForEach-Object FullName)
          if (-not ($files -like '*\SwissOlly.exe')) { Write-Error 'SwissOlly.exe is missing from the publish folder.'; exit 1 }
          & ./installer/sign.ps1 @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Pinned: the ISCC path below is Inno Setup 6's, and a version 7 package installs elsewhere.
      - name: Install Inno Setup
        # --allow-downgrade: the runner image may already carry a newer 6.x.
        run: choco install innosetup --version=6.7.1 --allow-downgrade -y --no-progress

      # When signing, Inno Setup signs Setup and the uninstaller itself through installer/sign.ps1
      # ($q and $f are Inno's quote and quoted-file-name placeholders, kept literal here).
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "/DMyAppVersion=${{ needs.verify.outputs.number }}"
            "/DMyAppArch=${{ matrix.arch_flag }}"
            "/DMyPublishDir=..\publish\${{ matrix.platform }}"
            "/DMyOutputSuffix=-${{ matrix.platform }}"
          )
          if ($env:SIGNING -eq 'true') {
            $script = Join-Path $env:GITHUB_WORKSPACE 'installer\sign.ps1'
            $iscc += '/Sswissolly=pwsh -NoProfile -NonInteractive -File $q' + $script + '$q $f'
            $iscc += '/DMySignTool=swissolly'
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @iscc installer/swissolly-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record signature
        shell: pwsh
        run: |
          Get-ChildItem installer/Output/*.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
            $line = if ($signature.Status -eq 'Valid') {
              "$($_.Name): signed by $($signature.SignerCertificate.GetNameInfo('SimpleName', $false))"
            } else {
              "$($_.Name): not signed ($($signature.Status))"
            }
            Write-Host $line
            "- $line" >> $env:GITHUB_STEP_SUMMARY
            # A signed release must not ship an unsigned installer by accident.
            if ($env:SIGNING -eq 'true' -and $signature.Status -ne 'Valid') { exit 1 }
          }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SwissOllySetup-${{ matrix.platform }}-${{ env.RELEASE_VERSION }}
          path: installer/Output/*.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-installer
    permissions:
      contents: write

    steps:
      # Needed for the tag below and for the release notes file.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: SwissOllySetup-*
          merge-multiple: true
          path: installers/

      - name: Write checksums
        working-directory: installers
        run: |
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" > /dev/null; then
            echo "Tag $RELEASE_VERSION already exists." >&2
            exit 1
          fi
          git tag "$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Pick release notes
        id: notes
        run: |
          notes="docs/release-notes/$RELEASE_VERSION.md"
          if [ -f "$notes" ]; then echo "path=$notes" >> "$GITHUB_OUTPUT"; else echo "No $notes; using generated notes only."; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            installers/*.exe
            installers/SHA256SUMS.txt
          body_path: ${{ steps.notes.outputs.path }}
          draft: true
          generate_release_notes: true
