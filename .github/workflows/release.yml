name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 1.2.0). Must match <Version> in Directory.Build.props.'
        required: true
        default: '1.2.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # A tag push releases that tag; a manual run releases the version typed in. Read through env,
  # never interpolated into scripts, so the input can't inject shell.
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  # Everything that can refuse a release runs first, before two installer builds are spent on it.
  verify:
    name: Verify release
    runs-on: windows-latest
    outputs:
      number: ${{ steps.version.outputs.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, to check the release commit is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check version
        id: version
        shell: pwsh
        run: |
          # Exactly one leading v: a manual run given "v1.2.0" (the input wants 1.2.0) would
          # otherwise tag and draft "vv1.2.0".
          # [0-9] and \z: \d takes any Unicode digit and $ allows a trailing newline, which would
          # pass here and then break the git tag step.
          if ($env:RELEASE_VERSION -cmatch '^v([0-9]+\.[0-9]+\.[0-9]+)\z') {
            $version = $Matches[1]
          } else {
            Write-Error "Release version '$env:RELEASE_VERSION' must look like v1.2.0 (for a manual run, type 1.2.0)."
            exit 1
          }
          # One version everywhere: the tag, the installer and the app's assembly version.
          [xml]$props = Get-Content Directory.Build.props
          $projectVersion = "$($props.Project.PropertyGroup.Version)".Trim()
          if ($projectVersion -ne $version) {
            Write-Error "Directory.Build.props says $projectVersion but this release is $version. Bump <Version> first."
            exit 1
          }
          "number=$version" >> $env:GITHUB_OUTPUT

      - name: Check the release commit is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "$env:GITHUB_SHA isn't on main. Merge the release first, then tag main."
            exit 1
          }

      - name: Check the tag is new (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          # The full-history checkout above fetched every tag, so this needs no credentials.
          git rev-parse -q --verify "refs/tags/$env:RELEASE_VERSION" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Tag $env:RELEASE_VERSION already exists."
            exit 1
          }
          exit 0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test SwissOlly.Tests/SwissOlly.Tests.csproj -c Release --verbosity normal

  build-installer:
    name: Build Installer (${{ matrix.platform }})
    runs-on: windows-latest
    needs: verify

    strategy:
      matrix:
        platform: [x64, ARM64]
        include:
          - platform: x64
            runtime: win-x64
            arch_flag: x64compatible
          - platform: ARM64
            runtime: win-arm64
            arch_flag: arm64

    env:
      # `secrets` is not available in step conditions, so expose only whether a certificate exists.
      HAS_SIGNING_CERT: ${{ secrets.CODE_SIGN_PFX != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # NuGet packages bring their own build targets; don't leave the repo token on disk for them.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SwissOlly.sln

      - name: Publish app (self-contained ${{ matrix.platform }})
        run: dotnet publish SwissOlly.App/SwissOlly.App.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.runtime }} --self-contained -p:Version=${{ needs.verify.outputs.number }} -o publish/${{ matrix.platform }}

      # Signing is for SmartScreen and publisher trust: the app runs asInvoker with uiAccess
      # off, so nothing requires a signature to run. Unsigned builds still release, and the
      # release notes have to say so.
      - name: Sign executable
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_PFX }}
          PFX_PASS: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { Write-Error 'signtool.exe not found in any installed Windows SDK.'; exit 1 }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'swissolly-sign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            & $signtool.FullName sign /f $pfxPath /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "publish/${{ matrix.platform }}/SwissOlly.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $pfxPath -ErrorAction SilentlyContinue
          }

      # Pinned: the ISCC path below is Inno Setup 6's, and a version 7 package installs elsewhere.
      - name: Install Inno Setup
        # --allow-downgrade: the runner image may already carry a newer 6.x.
        run: choco install innosetup --version=6.7.1 --allow-downgrade -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ needs.verify.outputs.number }}" "/DMyAppArch=${{ matrix.arch_flag }}" "/DMyPublishDir=..\publish\${{ matrix.platform }}" "/DMyOutputSuffix=-${{ matrix.platform }}" installer/swissolly-setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_PFX }}
          PFX_PASS: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { Write-Error 'signtool.exe not found in any installed Windows SDK.'; exit 1 }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'swissolly-sign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            Get-ChildItem installer/Output/*.exe | ForEach-Object {
              & $signtool.FullName sign /f $pfxPath /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            Remove-Item $pfxPath -ErrorAction SilentlyContinue
          }

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SwissOllySetup-${{ matrix.platform }}-${{ env.RELEASE_VERSION }}
          path: installer/Output/*.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-installer
    permissions:
      contents: write

    steps:
      # Needed for the tag below and for the release notes file.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: SwissOllySetup-*
          merge-multiple: true
          path: installers/

      - name: Write checksums
        working-directory: installers
        run: |
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" > /dev/null; then
            echo "Tag $RELEASE_VERSION already exists." >&2
            exit 1
          fi
          git tag "$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Pick release notes
        id: notes
        run: |
          notes="docs/release-notes/$RELEASE_VERSION.md"
          if [ -f "$notes" ]; then echo "path=$notes" >> "$GITHUB_OUTPUT"; else echo "No $notes; using generated notes only."; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            installers/*.exe
            installers/SHA256SUMS.txt
          body_path: ${{ steps.notes.outputs.path }}
          draft: true
          generate_release_notes: true
