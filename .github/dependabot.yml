version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A Windows App SDK major changes the XAML runtime this app's custom controls rely on;
      # take those by hand and test in the app, not through an automatic PR.
      - dependency-name: Microsoft.WindowsAppSDK
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
